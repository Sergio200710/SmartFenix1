<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de proyecto | SmartFenix</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar">
    <div class="brand">SmartFenix</div>
    <nav class="nav">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/clientes}">Clientes</a>
        <a th:href="@{/empleados}">Empleados</a>
        <a th:href="@{/proyectos}">Proyectos</a>
        <a th:href="@{/tareas}">Tareas</a>
    </nav>
</header>

<main class="container">
    <section>
        <div class="page-header">
            <div>
                <h1 th:text="${modoEdicion} ? 'Editar proyecto' : 'Nuevo proyecto'"></h1>
                <p>Completa los datos del proyecto.</p>
            </div>
            <a class="button secondary" th:href="@{/proyectos}">Volver</a>
        </div>

        <form class="form-card"
              th:object="${proyecto}"
              th:action="${modoEdicion} ? @{/proyectos/actualizar/{id}(id=${proyecto.id})} : @{/proyectos/guardar}"
              method="post">
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" th:field="*{nombre}" placeholder="Nombre del proyecto">
            <p class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>

            <label for="fechaInicio">Fecha de inicio</label>
            <input id="fechaInicio" type="date" th:field="*{fechaInicio}">

            <label for="fechaFin">Fecha de fin</label>
            <input id="fechaFin" type="date" th:field="*{fechaFin}">

            <label for="clienteId">Cliente</label>
            <select id="clienteId" name="clienteId">
                <option value="">Selecciona un cliente</option>
                <option th:each="cliente : ${clientes}"
                        th:value="${cliente.id}"
                        th:text="${cliente.nombre + (cliente.empresa != null ? ' - ' + cliente.empresa : '')}"
                        th:selected="${clienteSeleccionadoId != null and cliente.id == clienteSeleccionadoId}"></option>
            </select>

            <div class="form-actions">
                <button class="button" type="submit" th:text="${modoEdicion} ? 'Actualizar' : 'Guardar'"></button>
                <a class="button secondary" th:href="@{/proyectos}">Cancelar</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
