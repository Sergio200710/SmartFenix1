<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de tarea | SmartFenix</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar">
    <div class="brand">SmartFenix</div>
    <nav class="nav">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/clientes}">Clientes</a>
        <a th:href="@{/empleados}">Empleados</a>
        <a th:href="@{/proyectos}">Proyectos</a>
        <a th:href="@{/tareas}">Tareas</a>
    </nav>
</header>

<main class="container">
    <section>
        <div class="page-header">
            <div>
                <h1 th:text="${modoEdicion} ? 'Editar tarea' : 'Nueva tarea'"></h1>
                <p>Completa los datos de la tarea.</p>
            </div>
            <a class="button secondary" th:href="@{/tareas}">Volver</a>
        </div>

        <form class="form-card"
              th:object="${tarea}"
              th:action="${modoEdicion} ? @{/tareas/actualizar/{id}(id=${tarea.id})} : @{/tareas/guardar}"
              method="post">
            <label for="descripcion">Descripción</label>
            <input id="descripcion" type="text" th:field="*{descripcion}" placeholder="Descripción de la tarea">
            <p class="field-error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></p>

            <label for="estado">Estado</label>
            <input id="estado" type="text" th:field="*{estado}" placeholder="Pendiente, En progreso, Completada...">

            <label for="proyectoId">Proyecto</label>
            <select id="proyectoId" name="proyectoId">
                <option value="">Selecciona un proyecto</option>
                <option th:each="proyecto : ${proyectos}"
                        th:value="${proyecto.id}"
                        th:text="${proyecto.nombre}"
                        th:selected="${proyectoSeleccionadoId != null and proyecto.id == proyectoSeleccionadoId}"></option>
            </select>

            <label for="empleadoId">Empleado</label>
            <select id="empleadoId" name="empleadoId">
                <option value="">Selecciona un empleado</option>
                <option th:each="empleado : ${empleados}"
                        th:value="${empleado.id}"
                        th:text="${empleado.nombre}"
                        th:selected="${empleadoSeleccionadoId != null and empleado.id == empleadoSeleccionadoId}"></option>
            </select>

            <div class="form-actions">
                <button class="button" type="submit" th:text="${modoEdicion} ? 'Actualizar' : 'Guardar'"></button>
                <a class="button secondary" th:href="@{/tareas}">Cancelar</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
